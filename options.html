<!DOCTYPE html>
<html>
<head>
  <title>Sound Scheduler Options</title>
  <link href="options.css" rel="stylesheet">
</head>
<body>
<h1>Options</h1>
<label>
  Active
  <input id="active" type="checkbox">
</label>
<label>
  Select current week
  <select id="week">
    <option value="1">Week 1</option>
    <option value="2">Week 2</option>
  </select>
</label>
<button id="add-time">Add Time</button>
<div id="times">
  <div class="week-times" id="week-1-times"></div>
  <div class="week-times" id="week-2-times"></div>
</div>
<script src="options.js"></script>
</body>
</html>
